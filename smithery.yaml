name: regex-ai-mcp
description: MCP server for regex ai. Features build regex, test regex, explain regex.
  From MEOK AI Labs.
version: 1.0.0
tools:
- name: build_regex
  description: 'Build common regex patterns. Types: email, url, phone, ipv4, date_iso,
    hex_color, credit_card, ssn, zip_us, uuid. Or describe a custom pattern.'
  parameters:
  - name: pattern_type
    type: string
    required: true
  - name: custom_options
    type: string
    required: false
- name: test_regex
  description: 'Test a regex pattern against a string. Flags: i(gnorecase), m(ultiline),
    s(dotall).'
  parameters:
  - name: pattern
    type: string
    required: true
  - name: test_string
    type: string
    required: true
  - name: flags
    type: string
    required: false
- name: explain_regex
  description: Explain a regex pattern in plain English.
  parameters:
  - name: pattern
    type: string
    required: true
- name: extract_matches
  description: Extract all matches of a pattern from text. group=0 for full match,
    1+ for capture groups.
  parameters:
  - name: pattern
    type: string
    required: true
  - name: text
    type: string
    required: true
  - name: group
    type: integer
    required: false
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
    - apiKey
    properties:
      apiKey:
        type: string
        description: Your MEOK API Key
  commandFunction: "(config) => ({\n  command: 'uvx',\n  args: ['regex-ai-mcp', '--api-key',\
    \ config.apiKey],\n  env: {\n    MEOK_API_KEY: config.apiKey\n  }\n})"
